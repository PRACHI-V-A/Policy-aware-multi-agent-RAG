services:
  - type: web
    name: policy-claim-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: policy-claim-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_URL
        fromService:
          name: policy-claim-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL